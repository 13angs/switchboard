name: build-dist

# Builds the React UI on CI so machines that cannot run the Vite toolchain
# locally (Termux/PRoot on Android — see README § Running without a local
# build) can fetch a prebuilt `dist/` instead. Also acts as the build check
# for pull requests.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30
          if-no-files-found: error
